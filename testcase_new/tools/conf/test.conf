# 测试 runner 共用环境配置。不传 --conf 且本文件存在时自动加载（Java、Python、PHP）。
# 格式：KEY=value。不要写 export。未知键会被各 runner 忽略。值留空表示不覆盖。
# 优先级：用例源配置 < 本文件或 --conf < 环境变量 < 命令行。
# 本文件只放环境配置；用例参数在此留空，由各用例目录的源配置决定。

DB_HOSTNAME=localhost
SVCNAME=11810
INSTALL_DIR=/opt/sequoiadb
JAVA_HOME=
RSRVNODEDIR=/opt/sequoiadb/database/

# 用例参数：留空则使用用例目录自带默认值，需要时再填写覆盖
# PHP phpunit.xml：sdv_php_test / 2600 / 2700；Python config.json：driver_python_test / 26000 / 27000
CHANGEDPREFIX=
RSRVPORTBEGIN=
RSRVPORTEND=

ES_IP=
ES_PORT=9200
ES_PORT_RELIABILITY=9200

S3HOSTNAME=
S3SVCNAME=8002
S3CLIENTDIR=

ROOT_USER=
ROOT_PWD=

SDBDRIVERDIR=
THREADEXECUTOR_DIR=
SCRIPTDIR=

FULLTEXTPREFIX=

COORDS=
USERNAME=
PASSWORD=
MYSQLURL=
MYSQLUSERNAME=
MYSQLPASSWORD=
