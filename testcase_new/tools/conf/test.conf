# 本地测试 runner 共用环境配置。不传 --conf 且本文件存在时自动加载。
# 格式：KEY=value。不要写 export。未知键会被各 runner 忽略。
# CI 显式 --conf 指向 db-ci/src/conf/test.conf，不会读到本文件。

DB_HOSTNAME=localhost
SVCNAME=11810
INSTALL_DIR=/opt/sequoiadb
JAVA_HOME=

# PHP / 驱动 runner 补充参数
CHANGEDPREFIX=sdv_php_test
RSRVPORTBEGIN=2600
RSRVPORTEND=2700
RSRVNODEDIR=/opt/sequoiadb/database/

ES_IP=
ES_PORT=9200
ES_PORT_RELIABILITY=9200

S3HOSTNAME=
S3SVCNAME=8002
S3CLIENTDIR=

ROOT_USER=
ROOT_PWD=

SDBDRIVERDIR=
THREADEXECUTOR_DIR=
SCRIPTDIR=

FULLTEXTPREFIX=

COORDS=
USERNAME=
PASSWORD=
MYSQLURL=
MYSQLUSERNAME=
MYSQLPASSWORD=
